[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-duckdb"
version = "0.1.0"
description = "Sweep a folder of documents into three tables and ask it in SQL."
readme = "README.md"
requires-python = ">=3.10"
# Not licensed for release. The classifier below is what stops an accidental upload.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pypdfium2>=4",
    "python-docx>=1.0",
    "python-pptx>=0.6.21",
    "openpyxl>=3.1",
    "duckdb>=0.10",
]

[project.scripts]
doc-duckdb = "docduckdb.cli:main"

[tool.setuptools]
packages = ["docduckdb", "docduckdb.backends"]

[tool.setuptools.package-data]
docduckdb = ["sql/*.sql"]
